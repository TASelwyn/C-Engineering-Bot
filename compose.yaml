services:
  bot:
    build:
      context: .
      secrets:
        - github_actor
        - github_token
    image: ghcr.io/taselwyn/c-engineering-bot:latest
    restart: unless-stopped
    volumes:
      - ./data:/app/data


# Credentials for GitHub Packages (Wooclapper), read from the host environment at build time
secrets:
  github_actor:
    environment: GITHUB_ACTOR
  github_token:
    environment: GITHUB_TOKEN
